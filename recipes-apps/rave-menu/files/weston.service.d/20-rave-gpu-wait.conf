[Unit]
Wants=systemd-udev-settle.service
After=systemd-udev-settle.service

[Service]
# Avoid one-shot boot races where DRM/card0 appears slightly later.
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 10 ]; do [ -e /dev/dri/card0 ] && exit 0; i=$((i+1)); sleep 1; done; exit 0'
Restart=on-failure
RestartSec=2
