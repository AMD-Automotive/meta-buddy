[Unit]
# Bind the ordering to Weston itself rather than putting Before=weston.service
# in the oneshot. A bare Before= only holds when both units are in the same
# transaction, so it would miss socket activation, a manual systemctl start,
# and the Restart=on-failure path from 20-rave-gpu-wait.conf.
Requires=rave-localization.service
After=rave-localization.service

[Service]
# Leading '-' so a missing file is not fatal, unlike weston-init's own
# EnvironmentFile=/etc/default/weston. This file is ours alone; nothing else
# writes it. Supplies LANG and RAVE_CHROMIUM_EXTRA_ARGS=--lang=<tag>.
EnvironmentFile=-/etc/default/rave-localization
