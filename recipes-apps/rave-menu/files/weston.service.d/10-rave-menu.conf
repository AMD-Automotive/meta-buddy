[Service]
# systemd cannot merge two ExecStart= resets, so this package is mutually
# exclusive with weston-config-safed from meta-erica-x86 (which supplies the
# safe-display compositor configuration). Only one may be in an image.
#
# The config is generated per boot into /run by apply_localization.py so the
# package and the runtime never write the same path. The guard below restores
# the static fallback if that did not happen: Weston exits 1 on a missing
# --config file, and with Restart=on-failure that means a dead kiosk rather
# than a degraded one. '+' runs it as root, which is required because the unit
# itself runs as User=weston and cannot write a root-owned /run directory.
ExecStartPre=+/bin/sh -c '[ -s /run/rave-menu/weston.ini ] || install -D -m 0644 /etc/xdg/weston/rave-menu.ini /run/rave-menu/weston.ini'
ExecStart=
ExecStart=/usr/bin/weston --modules=systemd-notify.so --config=/run/rave-menu/weston.ini
