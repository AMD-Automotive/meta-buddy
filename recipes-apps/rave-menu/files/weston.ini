# Static fallback, installed to /etc/xdg/weston/rave-menu.ini and never written
# at runtime. Weston actually loads /run/rave-menu/weston.ini, which
# apply_localization.py renders from weston.ini.in on every boot. This copy is
# what the ExecStartPre guard installs if that render ever fails -- Weston
# exits 1 on a missing config, so "no config" is a dead display, not a
# degraded one. Keep the factory GB keymap here in step with
# localization.defaults.json.

[core]
idle-time=0
shell=kiosk-shell.so

[autolaunch]
path=/usr/bin/rave-cog-launch.sh
watch=true

[keyboard]
keymap_rules=evdev
keymap_model=pc105
keymap_layout=gb
