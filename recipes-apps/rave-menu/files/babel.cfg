# Message extraction map for `pybabel extract -F babel.cfg -o
# translations/messages.pot .`
#
# Source strings are British English and act as the msgids, so there is no
# en_GB catalogue -- gettext returns the msgid when a translation is absent,
# which is already the desired output.
#
# JS strings are NOT listed here. They are rendered into the page from the
# Jinja catalogue rather than authored in .js, so extraction stays single
# -source; adding a [javascript:] section without that would silently produce
# two divergent string sets.

[python: **.py]
[jinja2: **/templates/**.html]
