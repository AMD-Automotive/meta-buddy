# Add this layer's conf and classes to BBPATH
BBPATH .= ":${LAYERDIR}"

# Support both one-level and two-level recipe directory layouts
BBFILES += "${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-buddy"
BBFILE_PATTERN_meta-buddy = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-buddy = "8"

LAYERDEPENDS_meta-buddy = "core meta-erica-x86 rauc"
LAYERSERIES_COMPAT_meta-buddy = "scarthgap"

# Chromium 138 asserts Node major version 22; meta-openembedded at the revision
# this product builds against ships only 20.18.2, so the recipe is carried in
# this layer. Pinned explicitly rather than relying on version ordering.
PREFERRED_VERSION_nodejs = "22.14.0"
PREFERRED_VERSION_nodejs-native = "22.14.0"

# This layer builds the buddy menu, which has no safe-display component. Turn
# off the safe-display kernel patches and config that meta-erica-x86 would
# otherwise apply: the kernel is shared by every image in a build, so carrying
# them here puts dw-edma in the menu image, where it binds to the Versal on the
# hotplug re-enumeration after JTAG programming and hangs the board.
# rave2-safed-x86 refuses to build when this is 0, so the two cannot be mixed
# silently.
SAFED_KERNEL = "0"

INHERIT += "image-buildinfo"
IMAGE_BUILDINFO_VARS:append = " DATETIME DISTRO_NAME IMAGE_BASENAME MACHINE TUNE_PKGARCH"
IMAGE_BUILDINFO_VARS:append = " MACHINE_FEATURES DISTRO_FEATURES COMMON_FEATURES IMAGE_FEATURES"
