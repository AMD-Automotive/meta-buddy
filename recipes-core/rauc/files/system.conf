[system]
compatible=rave2-x86-boardtest
bootloader=grub
grubenv=/boot/efi/EFI/BOOT/grubenv
mountprefix=/mnt/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/nvme0n1p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/nvme0n1p3
type=ext4
bootname=B
