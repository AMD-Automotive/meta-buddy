# Expose Versal I2S (hw:1,1) as a separate PipeWire sink.
#
# Mirrors the PulseAudio module-alsa-sink that previously worked:
#   load-module module-alsa-sink device=hw:1,1 rate=48000 format=s16le channels=2
#
# Pinned to 48 kHz S16LE stereo to match the codec's clock tree.
# api.alsa.headroom needed because the ACP70 DMA requires pre-fill before
# it can start without XRUN. 2048 frames = 42ms — enough for PLL lock.
# api.alsa.period-size/period-num match PA's default buffer geometry.

context.objects = [
    {
        factory = adapter
        args = {
            factory.name   = api.alsa.pcm.sink
            node.name      = "acp_versal_i2s"
            node.description = "Versal I2S"
            media.class    = "Audio/Sink"
            api.alsa.path  = "hw:1,1"
            audio.format   = S16LE
            audio.rate     = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            api.alsa.period-size = 1024
            api.alsa.period-num  = 4
            api.alsa.headroom    = 2048
            # Let PipeWire close the ALSA device when idle so that the codec's
            # hw_params callback (which runs the BCLK-lock golden sequence and
            # writes c010=0xC2) re-fires on every playback.  When the device is
            # held permanently open, only prepare+trigger run on subsequent
            # plays; if the PLL fails to lock on trigger, the in-trigger
            # recovery writes are silently rejected by the chip and the codec
            # ends up wedged at c010=0x03 until the next reboot.
            node.pause-on-idle   = true
            session.suspend-timeout-seconds = 5
        }
    }
]
