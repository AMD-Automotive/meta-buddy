# Pin PipeWire volume to 1.0 (100%) on the ADAU1860 Versal I2S sink.
#
# The ADAU1860 DAC has its own hardware volume register (DAC_VOL0) with
# finer granularity (-71.25 to +24 dB in 0.375 dB steps) controlled
# directly by the rave-menu backend. PipeWire software volume must stay
# at unity to avoid double-attenuation confusion.
#
# This rule prevents applications (including Chromium) from accidentally
# adjusting PipeWire's stream volume on this sink.

monitor.alsa.rules = [
    {
        matches = [
            { node.name = "acp_versal_i2s" }
        ]
        actions = {
            update-props = {
                audio.volume           = 1.0
                node.pause-on-idle     = false
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
