# RAVE2 audio defaults for NAU8822 on ACP70.
#
# Keep the PipeWire node always running so WirePlumber does not re-apply
# routes on device wake (which would override headphone mixer settings).
# The correct ALSA mixer state is set by alsa-restore-acp.service.

monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "~alsa_output.*acp70-nau8822*"
            }
        ]
        actions = {
            update-props = {
                audio.volume           = 0.79
                node.pause-on-idle     = false
                priority.session       = 2000
            }
        }
    }
    {
        matches = [
            {
                node.name = "acp_versal_i2s"
            }
        ]
        actions = {
            update-props = {
                priority.session       = 1000
            }
        }
    }
]
