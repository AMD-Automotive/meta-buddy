# AMD Strix Halo HDMI audio fixes
#
# 1. snd_hda_intel: DMA position tracking under Xen PCI passthrough.
#
# Kernel reports without these settings:
#   "snd_hda_intel ...: IRQ timing workaround is activated for card #0.
#    Suggest a bigger bdl_pos_adj."
#
# bdl_pos_adj=64 -> larger BDL position adjustment (kernel default -1=auto=1).
# position_fix=1 -> use LPIB register instead of position-buffer DMA
#                   write-back (write-back is unreliable under Xen).
options snd_hda_intel bdl_pos_adj=64 position_fix=1

# 2. snd_hda_codec_hdmi: pin a static PCM format on the HDMI codec.
#
# Symptom without this: every new HDMI stream starts with an audible
# click and plays slightly fast for ~1-2 seconds before settling
# (issue is HDMI-only, never reproduced on the analog NAU8822 path or
# the Versal I2S sink).
#
# The AMD HDMI audio path (amdgpu audio component <-> HDA codec)
# re-derives the audio link clock (N/CTS) on each open from the
# current display pixel clock; the first audio frames go out before
# that lock fully completes. With static_hdmi_pcm=1 the HDMI PCM
# advertises a fixed format set, so PulseAudio opens at a single
# sample rate and there is no per-stream codec renegotiation, which
# avoids the initial mis-clocked frames.
options snd_hda_codec_hdmi static_hdmi_pcm=1
