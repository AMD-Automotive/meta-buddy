# UCM2 master profile for the AMD ACP70 + NAU8822 + ADAU1860 (Lark) card.
#
# ALSA UCM2 finds this via:
#   ucm2/conf.d/${CardDriver}/${CardDriver}.conf
# CardDriver for this card = "acp70-nau8822" (snd_card->driver), card id
# "acp70nau8822". The ADAU1860 (Lark) dev-kit codec is on I2S_BT = PCM dev 1
# ("adau1860-sai0-1"); the NAU8822 headset is on dev 0.

Syntax 3

SectionUseCase."HiFi" {
	File "/conf.d/acp70-nau8822/HiFi.conf"
	Comment "ADAU1860 Lark dev kit: DAC playback + 4x PDM DMIC capture"
}
