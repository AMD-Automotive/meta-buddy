# HiFi verb for the ADAU1860 (Lark) on the ACP70 + NAU8822 card.
#
# The ADAU1860 is the I2S master (drives BCLK 3.072 MHz / LRCLK 48 kHz from its
# 24.576 MHz oscillator) over a 4-slot 16-bit TDM frame on PCM dev 1. Playback
# uses slots 0/1 (DAC); the 4 PDM digital mics map to slots 0-3 (capture).
#
# Control values captured from Phase D (playback) and Phase E (4-DMIC capture)
# bring-up on the EVAL-ADAU1860EBZ.

Syntax 3

SectionDevice."Headphones" {
	Comment "ADAU1860 DAC -> Headphone output"

	EnableSequence [
		cset "name='DAC Playback Switch' on"
		cset "name='DAC Playback Volume' 191"
		cset "name='Headphone Switch' on"
		cset "name='Headphone Volume' 57"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
		cset "name='DAC Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		# dev 1 = adau1860-sai0-1. The codec-master path requires a 4-slot
		# TDM frame (4ch x 16-bit x 48k = 3.072 MHz BCLK); stereo content
		# rides slots 0/1.
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 4
		PlaybackVolume "DAC Playback Volume"
		PlaybackSwitch "DAC Playback Switch"
	}
}

SectionDevice."DMIC" {
	Comment "ADAU1860 4x PDM digital microphones -> TDM slots 0-3"

	EnableSequence [
		cset "name='SPT0_OUT_SLOT0 Data Mux' 'DMIC0'"
		cset "name='SPT0_OUT_SLOT1 Data Mux' 'DMIC1'"
		cset "name='SPT0_OUT_SLOT2 Data Mux' 'DMIC2'"
		cset "name='SPT0_OUT_SLOT3 Data Mux' 'DMIC3'"
		cset "name='DMIC0 Capture Switch' on"
		cset "name='DMIC1 Capture Switch' on"
		cset "name='DMIC2 Capture Switch' on"
		cset "name='DMIC3 Capture Switch' on"
		cset "name='DMIC0 Capture Volume' 191"
		cset "name='DMIC1 Capture Volume' 191"
		cset "name='DMIC2 Capture Volume' 191"
		cset "name='DMIC3 Capture Volume' 191"
		cset "name='DMIC01 HPF Capture Switch' on"
		cset "name='DMIC23 HPF Capture Switch' on"
	]

	DisableSequence [
		cset "name='DMIC0 Capture Switch' off"
		cset "name='DMIC1 Capture Switch' off"
		cset "name='DMIC2 Capture Switch' off"
		cset "name='DMIC3 Capture Switch' off"
	]

	Value {
		CapturePriority 100
		# dev 1 = adau1860-sai0-1; 4-slot TDM frame carries DMIC0-3.
		CapturePCM "hw:${CardId},1"
		CaptureChannels 4
	}
}

SectionDevice."NAU8822" {
	Comment "NAU8822 analog speaker / headphone output"

	# dev 0 = nau8822-hifi-0 on ACP I2S_SP. Unmute the DAC -> output-mixer ->
	# speaker/headphone analog path (proven Phase F bring-up sequence). Without
	# this the NAU8822 PCM exists but is silent and UCM/WirePlumber never
	# surfaces it as a usable sink.
	EnableSequence [
		cset "name='Left Output Mixer LDAC Switch' on"
		cset "name='Right Output Mixer RDAC Switch' on"
		cset "name='Speaker Playback Switch' on"
		cset "name='Speaker Switch' on"
		cset "name='Speaker Volume' 63"
		cset "name='Headphone Playback Switch' on"
		cset "name='PCM Volume' 255"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Headphone Playback Switch' off"
	]

	Value {
		# Higher priority than the ADAU1860 dev-kit codec so the on-board
		# NAU8822 analog output is the preferred default sink.
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackVolume "PCM Volume"
		PlaybackSwitch "Speaker Switch"
	}
}

SectionDevice."NAU8822 Mic" {
	Comment "NAU8822 analog microphone input"

	# Differential mic into the input PGA -> ADC on dev 0. The NAU8822 ADC is
	# gated by the capture stream itself, so only the input-mixer routing and
	# the +20 dB boost need asserting here; the rave-menu mic calibration tunes
	# 'PGA Volume'.
	EnableSequence [
		cset "name='Left Input Mixer MicP Switch' on"
		cset "name='Left Input Mixer MicN Switch' on"
		cset "name='Right Input Mixer MicP Switch' on"
		cset "name='Right Input Mixer MicN Switch' on"
		cset "name='PGA Boost Volume' 1"
	]

	DisableSequence [
		cset "name='Left Input Mixer MicP Switch' off"
		cset "name='Right Input Mixer MicP Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
}
