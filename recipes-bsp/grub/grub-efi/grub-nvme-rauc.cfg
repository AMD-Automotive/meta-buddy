# grub-nvme-rauc.cfg — RAUC A/B slot-aware GRUB config for NVMe
# ESP_GRUB_TEMPLATE_REVISION=7
#
# This config is installed by init-install-efi.sh onto the NVMe EFI
# partition.  It reads grubenv to determine which menu slot (A or B)
# is active for the RAVE2 Buddy menu system, and provides a separate entry
# for Application A.
#
# RAUC manages grubenv variables:
#   ORDER   — "A B" or "B A" (which slot to try first)
#   A_TRY   — remaining boot attempts for slot A
#   A_OK    — 1 if slot A is confirmed good
#   B_TRY   — remaining boot attempts for slot B
#   B_OK    — 1 if slot B is confirmed good

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console

# Graphical themed menu
insmod all_video
insmod gfxterm
insmod font
insmod png
insmod gfxmenu
insmod loadenv

set gfxmode=1920x1080,1024x768,auto
set gfxpayload=keep

# Load fonts for the theme BEFORE switching to gfxterm.
# gfxterm needs a font at init; without one it silently stays in text mode.
loadfont /EFI/BOOT/theme/DejaVuSans12.pf2
loadfont /EFI/BOOT/theme/DejaVuSans14.pf2
loadfont /EFI/BOOT/theme/DejaVuSans16.pf2
loadfont /EFI/BOOT/theme/DejaVuSans18.pf2
loadfont /EFI/BOOT/theme/DejaVuSansBold18.pf2
loadfont /EFI/BOOT/theme/DejaVuSansBold20.pf2

terminal_output gfxterm serial

# Apply theme
set theme=/EFI/BOOT/theme/theme.txt

# ── Load RAUC environment ────────────────────────────────────────────
load_env

# ── SSDT overlays (loaded via initramfs) ─────────────────────────────
# ssdt_enabled is a comma-separated list of SSDT template names
# Set via: grub-editenv /boot/EFI/BOOT/grubenv set ssdt_enabled=adau1860
# The initrd lives on the ESP root and is updated by both the NVMe
# installer and the RAUC post-install hook. Keep loading it here so the
# initramfs ssdt-loader can consume $ssdt_param on NVMe boots.
if [ -n "$ssdt_enabled" ]; then
    set ssdt_param="ssdt=$ssdt_enabled"
else
    set ssdt_param=""
fi

# Defaults if grubenv is empty/missing
if [ -z "$ORDER" ]; then
    set ORDER="A B"
fi
if [ -z "$A_TRY" ]; then
    set A_TRY=0
fi
if [ -z "$B_TRY" ]; then
    set B_TRY=0
fi
if [ -z "$A_OK" ]; then
    set A_OK=1
fi
if [ -z "$B_OK" ]; then
    set B_OK=0
fi

# ── Determine active slot ────────────────────────────────────────────
# Parse ORDER — GRUB shell has no parameter expansion operators,
# so use explicit string comparison.
if [ "$ORDER" = "A B" ]; then
    set primary=A
else
    set primary=B
fi

# Boot-counting logic: decrement TRY counter for the primary slot.
# If TRY reaches 0 and OK is not set, fall back to the other slot.
# GRUB has no arithmetic expansion, so decrement with conditionals.
if [ "$primary" = "A" ]; then
    if [ "$A_TRY" -gt 0 ]; then
        if [ "$A_TRY" = "3" ]; then set A_TRY=2
        elif [ "$A_TRY" = "2" ]; then set A_TRY=1
        elif [ "$A_TRY" = "1" ]; then set A_TRY=0
        fi
        save_env A_TRY
        set active=A
    elif [ "$A_OK" = "1" ]; then
        set active=A
    elif [ "$B_OK" = "1" ]; then
        set active=B
    else
        set active=A
    fi
else
    if [ "$B_TRY" -gt 0 ]; then
        if [ "$B_TRY" = "3" ]; then set B_TRY=2
        elif [ "$B_TRY" = "2" ]; then set B_TRY=1
        elif [ "$B_TRY" = "1" ]; then set B_TRY=0
        fi
        save_env B_TRY
        set active=B
    elif [ "$B_OK" = "1" ]; then
        set active=B
    elif [ "$A_OK" = "1" ]; then
        set active=A
    else
        set active=B
    fi
fi

# ── Resolve disk and slot-specific paths ─────────────────────────────
# Derive boot disk from current ESP root (e.g. (hd0,gpt1) -> hd0)
# so we can address slot partitions on the same disk regardless of
# firmware disk ordering when USB media is present.
insmod regexp
if regexp --set=1:boot_disk '^(hd[0-9]+),gpt[0-9]+$' "$root"; then
    true
else
    set boot_disk=hd0
fi

if [ "$active" = "A" ]; then
    set menu_root="PARTUUID=@@MENU_A_PARTUUID@@"
    set fallback_root="PARTUUID=@@MENU_B_PARTUUID@@"
    set fallback_active=B
    set boot_part="($boot_disk,gpt2)"
    set fallback_part="($boot_disk,gpt3)"
else
    set menu_root="PARTUUID=@@MENU_B_PARTUUID@@"
    set fallback_root="PARTUUID=@@MENU_A_PARTUUID@@"
    set fallback_active=A
    set boot_part="($boot_disk,gpt3)"
    set fallback_part="($boot_disk,gpt2)"
fi

# ── Common kernel parameters ─────────────────────────────────────────
set xen_params="vga=keep console=com1 com1=115200,8n1,0x3F8,4 sched=null console_timestamps=boot dom0=pvh dom0_max_vcpus=6 dom0_mem=32G cpufreq=none"
set kernel_params="console=hvc0 clocksource=xen tsc=unstable earlyprintk=xen pcie_ports=native pciehp.pciehp_force=1 hpbussize=32 hpmmiosize=512M hpmmioprefsize=1G"

# ── Menu entries ─────────────────────────────────────────────────────
set default="menu"
set timeout=5
# Allow the user to override the menu countdown from grubenv (the rave-menu
# Boot settings UI writes `menu_timeout`). Stored in grubenv rather than this
# file so it survives App Store grub.cfg re-renders. Empty/unset keeps 5s.
if [ -n "$menu_timeout" ]; then
    set timeout="$menu_timeout"
fi
# If Ubuntu has been installed into the free NVMe space (by the rave-menu
# App Store "Install Ubuntu" action) it becomes the default boot entry,
# unless the user chose to keep the RAVE2 Buddy menu as default
# (ubuntu_default=0). Either way both stay selectable during the timeout.
if [ "$ubuntu_installed" = "1" -a "$ubuntu_default" != "0" ]; then
    set default="ubuntu"
fi
# Newer selector written by the App Store: `boot_default` (menu|ubuntu|app)
# takes precedence over the legacy ubuntu flags when set. An app slot can only
# become the default once it has actually been installed (app_installed=1).
if [ "$boot_default" = "menu" ]; then
    set default="menu"
fi
if [ "$boot_default" = "ubuntu" -a "$ubuntu_installed" = "1" ]; then
    set default="ubuntu"
fi
if [ "$boot_default" = "app" -a "$app_installed" = "1" ]; then
    set default="app-a"
fi
# One-shot selection, for trying a target without committing to it. Cleared
# before the entry is booted, not after, so an entry that hangs the machine is
# attempted exactly once and the next boot falls back to the default. This is
# the only safe way to test an app on a board whose GRUB has no serial console.
if [ -n "$next_entry" ]; then
    set default="$next_entry"
    set next_entry=
    save_env next_entry
fi
menuentry 'RAVE2 Buddy' --id menu {
    insmod gzio
    insmod ext2
    insmod mmap
    cutmem 0 0x1000

    # Try the selected slot first. If its kernel payload is missing,
    # fall back to the opposite slot once.
    if [ -e $boot_part/boot/xen.gz ]; then
        if [ -e $boot_part/boot/bzImage ]; then
            multiboot2 $boot_part/boot/xen.gz $xen_params
            module2 $boot_part/boot/bzImage $kernel_params $ssdt_param root=$menu_root rauc.slot=$active
            if [ -e $boot_part/boot/initrd ]; then
                module2 $boot_part/boot/initrd
            else
                module2 /initrd
            fi
        else
            multiboot2 $fallback_part/boot/xen.gz $xen_params
            module2 $fallback_part/boot/bzImage $kernel_params $ssdt_param root=$fallback_root rauc.slot=$fallback_active
            if [ -e $fallback_part/boot/initrd ]; then
                module2 $fallback_part/boot/initrd
            else
                module2 /initrd
            fi
        fi
    else
        multiboot2 $fallback_part/boot/xen.gz $xen_params
        module2 $fallback_part/boot/bzImage $kernel_params $ssdt_param root=$fallback_root rauc.slot=$fallback_active
        if [ -e $fallback_part/boot/initrd ]; then
            module2 $fallback_part/boot/initrd
        else
            module2 /initrd
        fi
    fi
}

# ── Application A (installed by the App Store into the app region) ────
# How the app boots is decided at install time and recorded in app-boot.cfg, a
# small file the App Store installer generates on the ESP next to this config.
# This config does not probe for kernels and does not lend the app the menu OS's
# arguments: an app that has not said how it boots does not boot, visibly.
#
#   entries (the normal case)
#       The installer wrote app-entry.cfg, either by lifting the entry the app
#       ships or by rendering the one it declared. Sourced verbatim, so the app
#       decides how it boots rather than this file.
#
#   chainload (disk-image apps that brought their own bootloader)
#       Hand off and let it read its own configuration. Needed for any app whose
#       root filesystem GRUB cannot read anyway (e.g. ext4 with orphan_file).
#
#   direct (deprecated; pre-declaration installs only)
#
# The entry title tracks the installed app's name via the grubenv `app_title`
# variable (written by the App Store installer); it falls back to a generic
# label when no app is installed. The --id stays stable so `boot_default=app`
# and the default-selection logic above keep working regardless of the title.
if [ -z "$app_title" ]; then
    set app_title="Application A"
fi

# Defaults describe a pre-declaration install, whose app-boot.cfg predates the
# entries mode or is absent entirely; anything installed since overrides them.
# GRUB has no --part-label search, so the partition is addressed by its pinned
# index with a file search as fallback.
set app_mode="direct"
set app_part="$boot_disk,gpt4"
set app_chainload=""
if [ -f /EFI/BOOT/app-boot.cfg ]; then
    source /EFI/BOOT/app-boot.cfg
fi

menuentry "$app_title" --id app-a {
    insmod gzio
    insmod ext2
    insmod part_gpt
    insmod chain
    insmod fat
    set app_root="PARTUUID=@@APP_A_PARTUUID@@"
    if [ "$app_mode" = "entries" ]; then
        # The app's own boot entry: either lifted from the config it ships or
        # rendered from the arguments it declared, and normalised at install
        # time. Sourced rather than reproduced here so that the app decides how
        # it boots, not us. It sets its own root, so $root must still be the ESP
        # at this point.
        if [ -f /EFI/BOOT/app-entry.cfg ]; then
            source /EFI/BOOT/app-entry.cfg
        else
            echo "app-entry.cfg is missing; cannot boot $app_title"
            sleep 5
        fi
    elif [ "$app_mode" = "chainload" ]; then
        if [ ! -e ($app_part)$app_chainload ]; then
            search --no-floppy --file $app_chainload --set=app_part
        fi
        chainloader ($app_part)$app_chainload
    elif [ "$app_mode" = "direct" ]; then
        # DEPRECATED. Written only for a bundle that declares no boot contract,
        # which the packer now refuses - so in practice this is reached only by
        # an app installed before declarations existed. Kept so a menu upgrade
        # does not strand an app already on the disk, and kept bit-for-bit
        # because those apps were commissioned against exactly these arguments -
        # including the fact that they inherit $xen_params and $kernel_params
        # from the menu OS, which is the very coupling app-entry.cfg exists to
        # break. Removable once no fielded unit can still hold such an app.
        if [ -e ($app_part)/boot/xen.gz -a -e ($app_part)/boot/bzImage ]; then
            multiboot2 ($app_part)/boot/xen.gz $xen_params
            module2 ($app_part)/boot/bzImage $kernel_params $ssdt_param root=$app_root
            if [ -e ($app_part)/boot/initrd ]; then
                module2 ($app_part)/boot/initrd
            fi
        elif [ -e ($app_part)/boot/bzImage ]; then
            linux ($app_part)/boot/bzImage root=$app_root ro
            if [ -e ($app_part)/boot/initrd ]; then
                initrd ($app_part)/boot/initrd
            fi
        elif [ -e ($app_part)/boot/vmlinuz ]; then
            linux ($app_part)/boot/vmlinuz root=$app_root ro
            if [ -e ($app_part)/boot/initrd.img ]; then
                initrd ($app_part)/boot/initrd.img
            fi
        else
            echo "no bootable kernel found in $app_title"
            sleep 5
        fi
    else
        echo "$app_title does not say how it boots (app_mode=$app_mode)"
        sleep 5
    fi
}

# ── Ubuntu (installed into the free NVMe space) ──────────────────────
# Only usable once the rave-menu installer has set ubuntu_installed=1 and
# ubuntu_fsuuid in grubenv. Boots bare-metal with Ubuntu's own kernel
# (no Xen). $ubuntu_fsuuid is the ext4 filesystem UUID of the Ubuntu root.
#
# Ubuntu's own GRUB is intentionally NOT installed; this master GRUB stays
# the sole boot manager. We boot the rolling /boot/vmlinuz and
# /boot/initrd.img symlinks, so Ubuntu kernel upgrades are picked up
# automatically with no grub.cfg regeneration. The "previous kernel" and
# "recovery mode" entries below replace the "Advanced options for Ubuntu"
# submenu a normal Ubuntu install would maintain.
if [ "$ubuntu_installed" = "1" ]; then
menuentry 'Ubuntu' --id ubuntu {
    insmod gzio
    insmod ext2
    insmod part_gpt
    search --no-floppy --fs-uuid --set=ubuntu_dev "$ubuntu_fsuuid"
    linux ($ubuntu_dev)/boot/vmlinuz root=UUID=$ubuntu_fsuuid ro quiet splash
    initrd ($ubuntu_dev)/boot/initrd.img
}
menuentry 'Ubuntu (previous kernel)' --id ubuntu-prev {
    insmod gzio
    insmod ext2
    insmod part_gpt
    search --no-floppy --fs-uuid --set=ubuntu_dev "$ubuntu_fsuuid"
    linux ($ubuntu_dev)/boot/vmlinuz.old root=UUID=$ubuntu_fsuuid ro quiet splash
    initrd ($ubuntu_dev)/boot/initrd.img.old
}
menuentry 'Ubuntu (recovery mode)' --id ubuntu-recovery {
    insmod gzio
    insmod ext2
    insmod part_gpt
    search --no-floppy --fs-uuid --set=ubuntu_dev "$ubuntu_fsuuid"
    linux ($ubuntu_dev)/boot/vmlinuz root=UUID=$ubuntu_fsuuid ro recovery nomodeset
    initrd ($ubuntu_dev)/boot/initrd.img
}
fi
