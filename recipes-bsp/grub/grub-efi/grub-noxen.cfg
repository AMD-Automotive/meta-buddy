# Custom Grub.cfg with menu entries for Xen, defaulting to xen after a 5s timeout.
# This is grub-noxen.cfg

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console

# Graphical themed menu
insmod all_video
insmod gfxterm
insmod font
insmod png
insmod gfxmenu
insmod loadenv

set gfxmode=1920x1080,1024x768,auto
set gfxpayload=keep

# Load fonts for the theme BEFORE switching to gfxterm.
# gfxterm needs a font at init; without one it silently stays in text mode.
loadfont /EFI/BOOT/theme/DejaVuSans12.pf2
loadfont /EFI/BOOT/theme/DejaVuSans14.pf2
loadfont /EFI/BOOT/theme/DejaVuSans16.pf2
loadfont /EFI/BOOT/theme/DejaVuSans18.pf2
loadfont /EFI/BOOT/theme/DejaVuSansBold18.pf2
loadfont /EFI/BOOT/theme/DejaVuSansBold20.pf2

terminal_output gfxterm serial

# Apply theme
set theme=/EFI/BOOT/theme/theme.txt

# -- Load grubenv (for ssdt_enabled and friends) --
load_env

# -- SSDT overlays via initramfs ssdt-loader --
# ssdt_enabled is a comma-separated list of SSDT template names,
# managed by the rave-menu Audio page. When set, the initramfs
# init.d/10-ssdt-loader module loads /lib/firmware/acpi/ssdt-templates/<name>.aml
# via configfs before drivers probe.
if [ -n "$ssdt_enabled" ]; then
    set ssdt_param="ssdt=$ssdt_enabled"
else
    set ssdt_param=""
fi

set timeout=5
set default='RAVE2 Buddy'

menuentry 'RAVE2 Buddy' {
    insmod gzio
    insmod mmap
    cutmem 0 0x1000

    multiboot2 /xen.gz vga=keep console=com1 com1=115200,8n1,0x3F8,4 \
        sched=null loglvl=none guest_loglvl=none console_timestamps=boot \
        dom0=pvh dom0_max_vcpus=6 dom0_mem=32G cpufreq=none

    module2 /bzImage $ssdt_param quiet systemd.show_status=false console=hvc0 root=/dev/sda2 clocksource=xen tsc=unstable earlyprintk=xen \
        pcie_ports=native pciehp.pciehp_force=1 \
        hpbussize=32 hpmmiosize=512M hpmmioprefsize=1G

    module2 /initrd
}

menuentry 'Install to NVME'{
linux /bzImage quiet loglevel=0 console=ttyS0,115200 console=tty0 LABEL=install-efi root=/dev/ram0
initrd /initrd
}

menuentry 'Custom App 1' {
    insmod ext2
    search --no-floppy --label --set=root app-rootfs-a
    linux /boot/bzImage root=/dev/nvme0n1p3 rw quiet loglevel=4 mce=off console=ttyS0,115200 console=tty0
}
