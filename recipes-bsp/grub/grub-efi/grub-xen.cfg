# Custom Grub.cfg with menu entries for Xen, defaulting to xen after a 60s timeout.
# This is grub-xen.cfg


serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
menuentry 'xen' {
    insmod gzio

    multiboot2 /xen.gz console=com1 com1=115200,8n1,0x3F8,4 \
        sched=null loglvl=all guest_loglvl=all console_timestamps=boot \
        dom0=pvh dom0_max_vcpus=6 dom0_mem=32G cpufreq=none

    module2 /bzImage console=hvc0 root=/dev/sda2 clocksource=xen tsc=unstable earlyprintk=xen \
        pcie_ports=native pciehp.pciehp_force=1 \
        hpbussize=32 hpmmiosize=512M hpmmioprefsize=1G

    module2 /initrd
}

menuentry 'boot'{
linux /bzImage LABEL=boot root=/dev/sda2 earlyprintk=xen pci=assign-busses,realloc=on,hpbussize=8,hpmmiosize=384M,hpmmioprefsize=2M pcie_ports=native pciehp.pciehp_force=1
initrd /initrd
}

menuentry 'install'{
linux /bzImage console=ttyS0,115200 console=tty0 ignore_loglevel loglevel=7 debug nomodeset mce=dont_log_ce LABEL=install-efi root=/dev/ram0 pci=assign-busses,realloc=on,hpbussize=8,hpmmiosize=384M,hpmmioprefsize=2M pcie_ports=native pciehp.pciehp_force=1
initrd /initrd
}

default=xen
timeout=1